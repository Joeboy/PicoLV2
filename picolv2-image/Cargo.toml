[package]
name = "picolv2-image"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
default = []
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
goblin = "0.10.5"
picolv2-image-format = { path = "../tools/picolv2-image-format" }
oxrdf = "0.3.3"
oxttl = "0.2.3"
eframe = { version = "0.31", optional = true }
rfd = { version = "0.15", optional = true }
