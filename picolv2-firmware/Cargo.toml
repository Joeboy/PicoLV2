[package]
edition = "2024"
name = "picolv2-firmware"
version = "0.1.0"
license = "MIT OR Apache-2.0"

publish = false

[dependencies]
embassy-executor = { version = "0.10.0", git = "https://github.com/embassy-rs/embassy", rev = "d66ac21e7e7ae0540e7225c3c1c52569b1292a87", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", git = "https://github.com/embassy-rs/embassy", rev = "d66ac21e7e7ae0540e7225c3c1c52569b1292a87", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.10.0", git = "https://github.com/embassy-rs/embassy", rev = "d66ac21e7e7ae0540e7225c3c1c52569b1292a87", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xa", "binary-info"] }
embassy-futures = { version = "0.1.2", git = "https://github.com/embassy-rs/embassy", rev = "d66ac21e7e7ae0540e7225c3c1c52569b1292a87" }
embassy-usb-driver = { version = "0.2.2", git = "https://github.com/embassy-rs/embassy", rev = "d66ac21e7e7ae0540e7225c3c1c52569b1292a87", features = ["defmt"] }
embassy-usb-host = { version = "0.1.0", git = "https://github.com/embassy-rs/embassy", rev = "d66ac21e7e7ae0540e7225c3c1c52569b1292a87", features = ["defmt"] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"
fixed = "1.23.1"

cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.0"
critical-section = "1.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
portable-atomic = { version = "1.5", features = ["critical-section"] }
pio = "0.3"

elf_loader = { version = "0.17.0", default-features = false }
embedded-alloc = { version = "0.7.0", features = ["tlsf"] }
heapless = "0.9"
static_cell = "2.1"
picolv2-image-format = { path = "../tools/picolv2-image-format" }

[profile.release]
# Enable generation of debug symbols even on release builds
debug = true

[package.metadata.embassy]
build = [
  { target = "thumbv8m.main-none-eabihf"}
]
